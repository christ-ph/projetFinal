{% extends "base.html" %}
{% block content %}
<h1>Clients</h1>
<a href="{% url 'partenaires:client_create' %}">+ Nouveau client</a>
<table>
    <tr><th>Nom</th><th>Prénom</th><th>Téléphone</th><th>Adresse</th><th>Actions</th></tr>
    {% for c in clients %}
    <tr>
        <td>{{ c.nom }}</td>
        <td>{{ c.prenom }}</td>
        <td>{{ c.telephone }}</td>
        <td>{{ c.adresse }}</td>
        <td>
            <a href="{% url 'partenaires:client_update' c.pk %}">Modifier</a>
            <a href="{% url 'partenaires:client_delete' c.pk %}">Supprimer</a>
        </td>
    </tr>
    {% empty %}
    <tr><td colspan="5">Aucun client.</td></tr>
    {% endfor %}
</table>
{% endblock %}
