{% extends "base.html" %}
{% block content %}
<h1>Fournisseurs</h1>
<a href="{% url 'partenaires:fournisseur_create' %}">+ Nouveau fournisseur</a>
<table>
    <tr><th>Nom</th><th>Prénom</th><th>Téléphone</th><th>Adresse</th><th>Actions</th></tr>
    {% for f in fournisseurs %}
    <tr>
        <td>{{ f.nom }}</td>
        <td>{{ f.prenom }}</td>
        <td>{{ f.telephone }}</td>
        <td>{{ f.adresse }}</td>
        <td>
            <a href="{% url 'partenaires:fournisseur_update' f.pk %}">Modifier</a>
            <a href="{% url 'partenaires:fournisseur_delete' f.pk %}">Supprimer</a>
        </td>
    </tr>
    {% empty %}
    <tr><td colspan="5">Aucun fournisseur.</td></tr>
    {% endfor %}
</table>
{% endblock %}
