{% extends "base.html" %}
{% block content %}
<h1>Articles</h1>
<a href="{% url 'stock:article_create' %}">+ Nouvel article</a>
<table>
    <tr><th>Nom</th><th>Catégorie</th><th>Quantité</th><th>Prix</th><th>Actions</th></tr>
    {% for a in articles %}
    <tr>
        <td><a href="{% url 'stock:article_detail' a.pk %}">{{ a.nom_article }}</a></td>
        <td>{{ a.categorie }}</td>
        <td>{{ a.quantite }}</td>
        <td>{{ a.prix_unitaire }}</td>
        <td>
            <a href="{% url 'stock:article_update' a.pk %}">Modifier</a>
            <a href="{% url 'stock:article_delete' a.pk %}">Supprimer</a>
        </td>
    </tr>
    {% empty %}
    <tr><td colspan="5">Aucun article.</td></tr>
    {% endfor %}
</table>
{% endblock %}
